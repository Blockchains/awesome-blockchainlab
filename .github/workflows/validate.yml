name: Validate
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "11 5 * * 1"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate forge.json (schema + every fork/upstream reachable)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/validate.py
